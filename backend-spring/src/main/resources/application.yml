server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: precision-nutrition-engine

  # Java 21 Project Loom Virtual Threads
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/precision_nutrition}
    username: ${SPRING_DATASOURCE_USERNAME:precision_user}
    password: ${SPRING_DATASOURCE_PASSWORD:precision_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: PrecisionHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema baseline from Docker/ETL"
    locations: classpath:db/migration

usda:
  api:
    key: ${USDA_API_KEY:DEMO_KEY}
    base-url: ${USDA_BASE_URL:https://api.nal.usda.gov/fdc/v1}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-precision-nutrition-jwt-secret-key-min-32-bytes}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:2592000}
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      temperature: 0.4
      max-output-tokens: 2048
      rate-limit-per-minute: 10
